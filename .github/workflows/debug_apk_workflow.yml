# This is a basic workflow to help you get started with Actions

name: Build & Distribute Debug APK

# Controls when the workflow will run
on:
  pull_request:
    branches: [ "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission
        run: chmod +x gradlew
        
      - name: Get build timestamp
        id: timestamp
        run: echo "value=$(date +'%d%m%y%H')" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PbuildTime=${{ steps.timestamp.outputs.value }}

      - name: List APK outputs
        run: find app/build/outputs/apk -name "*.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.timestamp.outputs.value }}
          name: "Build ${{ steps.timestamp.outputs.value }}"
          body: |
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Build:** ${{ steps.timestamp.outputs.value }}
          files: app/build/outputs/apk/debug/app-${{ steps.timestamp.outputs.value }}.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
